services:
  - type: web
    name: fourno
    runtime: image
    image:
      url: ghcr.io/fourno/fourno:latest
    plan: starter
    numInstances: 1
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        value: sqlite:/app/storage/data/cms.db
      - key: UPLOADS_DIR
        value: /app/storage/uploads
      - key: STATIC_DIR
        value: /app/dist
      # Render auto-injects RENDER_EXTERNAL_URL at runtime; Fourno uses it as
      # the CSRF public origin, so no proxy/origin config is needed here.
      - key: FOURNO_SECRET_KEY
        generateValue: true
    disk:
      name: storage
      mountPath: /app/storage
      sizeGB: 10
